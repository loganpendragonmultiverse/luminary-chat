version: 2
updates:
  - package-ecosystem: "github-actions"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
